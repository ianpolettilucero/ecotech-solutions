<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Las seis relaciones de UML con su notación y un ejemplo de cada una">
  <title>Las seis relaciones de UML con su notación y un ejemplo de cada una</title>
  <text x="480" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Las relaciones de UML y cuándo se usa cada una</text>
  <rect x="24" y="46" width="912" height="44" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 210 68 L 60 68" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="650" fill="#0f172a">Asociación</text>
  <text x="240" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Se conocen. La más común.</text>
  <text x="920" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#334155" text-anchor="end">Empleado — Proyecto</text>
  <rect x="24" y="98" width="912" height="44" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 210 120 L 60 120" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 70.2,115.9 L 60,120 L 70.2,124.1" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="117" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="650" fill="#0f172a">Asociación dirigida</text>
  <text x="240" y="133" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">A conoce a B, pero B no a A.</text>
  <text x="920" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#334155" text-anchor="end">Pedido → Cliente</text>
  <rect x="24" y="150" width="912" height="44" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 210 172 L 60 172" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="60,172 67.6,167.2 77.0,172.0 67.6,176.8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="169" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="650" fill="#0f172a">Agregación</text>
  <text x="240" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">La parte sobrevive al todo.</text>
  <text x="920" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#334155" text-anchor="end">Departamento ◇— Empleado</text>
  <rect x="24" y="202" width="912" height="44" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 210 224 L 60 224" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="60,224 67.6,219.2 77.0,224.0 67.6,228.8" fill="#64748b" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="221" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="650" fill="#0f172a">Composición</text>
  <text x="240" y="237" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">La parte muere con el todo.</text>
  <text x="920" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#334155" text-anchor="end">Proyecto ◆— Tarea</text>
  <rect x="24" y="254" width="912" height="44" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 210 276 L 60 276" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="60,276 72.4,269.4 72.4,282.6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="273" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="650" fill="#0f172a">Generalización</text>
  <text x="240" y="289" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">"Es un". Herencia.</text>
  <text x="920" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#334155" text-anchor="end">Contratista → Empleado</text>
  <rect x="24" y="306" width="912" height="44" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 210 328 L 60 328" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 70.2,323.9 L 60,328 L 70.2,332.1" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="325" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="650" fill="#0f172a">Dependencia</text>
  <text x="240" y="341" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">La usa de paso, sin guardarla.</text>
  <text x="920" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#334155" text-anchor="end">Informe ⇢ Exportador</text>
</svg>
