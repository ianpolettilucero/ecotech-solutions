  <rect x="60" y="246" width="280" height="32" rx="9" fill="#e3eefc" stroke="#1f6fd0" stroke-width="1.5"/>
  <text x="73" y="267" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="650" fill="#1e40af">III. Desarrollo</text>
