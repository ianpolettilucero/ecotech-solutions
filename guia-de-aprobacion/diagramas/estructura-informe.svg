  <text x="73" y="351" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="650" fill="#334155">V. Referencias</text>
  <rect x="600" y="128" width="300" height="38" rx="9" fill="#ddf6ec" stroke="#0d7d5a" stroke-width="1.5"/>
  <text x="613" y="149" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="650" fill="#065f46">Análisis del problema</text>
  <text x="890" y="161" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0d7d5a" text-anchor="end">Paso 1</text>
