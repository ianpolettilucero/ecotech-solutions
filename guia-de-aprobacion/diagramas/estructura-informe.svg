  <text x="890" y="257" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0d7d5a" text-anchor="end">Paso 3</text>
  <path d="M 344 258 L 470 258 L 470 243 L 596 243" fill="none" stroke="#1f6fd0" stroke-width="1.5"/>
  <path d="M 585.8,247.1 L 596,243 L 585.8,238.9" fill="none" stroke="#1f6fd0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="600" y="272" width="300" height="38" rx="9" fill="#ddf6ec" stroke="#0d7d5a" stroke-width="1.5"/>
  <text x="613" y="293" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="650" fill="#065f46">Mejoras aplicadas</text>
  <text x="890" y="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0d7d5a" text-anchor="end">Paso 4</text>
  <path d="M 344 258 L 470 258 L 470 291 L 596 291" fill="none" stroke="#1f6fd0" stroke-width="1.5"/>
  <path d="M 585.8,295.1 L 596,291 L 585.8,286.9" fill="none" stroke="#1f6fd0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 60 388 L 888 388 L 900 400 L 900 451 L 60 451 Z" fill="#fdefda" stroke="#a85b06" stroke-width="1.2"/>
  <path d="M 888 388 L 888 400 L 900 400" fill="none" stroke="#a85b06" stroke-width="1.2"/>
  <text x="70" y="405" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#92400e">La plantilla no tiene apartados para el análisis de IA ni para el diagrama. No es un descuido: es una plantilla genérica de la</text>
  <text x="70" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#92400e">institución, y ella misma avisa de que "cada docente DEBE modificar, ajustar o completar los apartados". Las cuatro secciones que</text>
  <text x="70" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#92400e">pide la guía se convierten en subtítulos DENTRO de "III. Desarrollo". Así se respetan las dos y no hay que elegir.</text>
</svg>
