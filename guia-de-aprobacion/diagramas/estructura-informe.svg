<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Las secciones de la guía encajan como subtítulos dentro del Desarrollo de la plantilla">
  <title>Las secciones de la guía encajan como subtítulos dentro del Desarrollo de la plantilla</title>
  <text x="470" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Cómo encajan la plantilla y la guía</text>
