<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-label="Agregación contra composición: la parte sobrevive al todo o no">
  <title>Agregación contra composición: la parte sobrevive al todo o no</title>
  <text x="470" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">La pregunta que decide: ¿la parte sobrevive al todo?</text>
  <rect x="20" y="50" width="440" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0a7f8e" text-anchor="middle">AGREGACIÓN  ◇</text>
  <text x="240" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Rombo hueco. Vidas independientes.</text>
  <rect x="40" y="122" width="150" height="54" rx="4" fill="#ffffff" stroke="#0a7f8e" stroke-width="1.5"/>
  <rect x="40" y="122" width="150" height="28" rx="4" fill="#ddf4f7" stroke="none"/>
  <rect x="40" y="144" width="150" height="6" fill="#ddf4f7" stroke="none"/>
  <text x="115" y="141" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0a6472" text-anchor="middle">Departamento</text>
  <line x1="40" y1="150" x2="190" y2="150" stroke="#0a7f8e" stroke-width="1.5"/>
  <text x="50" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">- nombre: str</text>
  <rect x="290" y="122" width="130" height="54" rx="4" fill="#ffffff" stroke="#0d7d5a" stroke-width="1.5"/>
  <rect x="290" y="122" width="130" height="28" rx="4" fill="#ddf6ec" stroke="none"/>
  <rect x="290" y="144" width="130" height="6" fill="#ddf6ec" stroke="none"/>
  <text x="355" y="141" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Empleado</text>
  <line x1="290" y1="150" x2="420" y2="150" stroke="#0d7d5a" stroke-width="1.5"/>
  <text x="300" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">- legajo: str</text>
  <path d="M 290 145 L 190 145" fill="none" stroke="#0a7f8e" stroke-width="1.5"/>
  <polygon points="190,145 197.6,140.2 207.0,145.0 197.6,149.8" fill="#ffffff" stroke="#0a7f8e" stroke-width="1.5"/>
  <text x="274" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">0..*</text>
  <text x="206" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">1</text>
  <path d="M 56 216 L 402 216 L 414 228 L 414 294 L 56 294 Z" fill="#ddf4f7" stroke="#0a7f8e" stroke-width="1.2"/>
  <path d="M 402 216 L 402 228 L 414 228" fill="none" stroke="#0a7f8e" stroke-width="1.2"/>
  <text x="66" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0a6472">Si se elimina el departamento, los empleados</text>
  <text x="66" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0a6472">siguen existiendo: se reasignan a otro. El</text>
  <text x="66" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0a6472">empleado NO es una pieza del departamento,</text>
  <text x="66" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0a6472">es alguien que pertenece a él por ahora.</text>
  <rect x="480" y="50" width="440" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6740e0" text-anchor="middle">COMPOSICIÓN  ◆</text>
  <text x="700" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Rombo relleno. La parte muere con el todo.</text>
  <rect x="500" y="122" width="130" height="54" rx="4" fill="#ffffff" stroke="#6740e0" stroke-width="1.5"/>
  <rect x="500" y="122" width="130" height="28" rx="4" fill="#ece7fd" stroke="none"/>
  <rect x="500" y="144" width="130" height="6" fill="#ece7fd" stroke="none"/>
  <text x="565" y="141" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Proyecto</text>
  <line x1="500" y1="150" x2="630" y2="150" stroke="#6740e0" stroke-width="1.5"/>
  <text x="510" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">- codigo: str</text>
  <rect x="730" y="122" width="155" height="54" rx="4" fill="#ffffff" stroke="#a85b06" stroke-width="1.5"/>
  <rect x="730" y="122" width="155" height="28" rx="4" fill="#fdefda" stroke="none"/>
  <rect x="730" y="144" width="155" height="6" fill="#fdefda" stroke="none"/>
  <text x="807.5" y="141" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">RegistroTiempo</text>
  <line x1="730" y1="150" x2="885" y2="150" stroke="#a85b06" stroke-width="1.5"/>
  <text x="740" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">- horas: float</text>
  <path d="M 730 145 L 630 145" fill="none" stroke="#6740e0" stroke-width="1.5"/>
  <polygon points="630,145 637.6,140.2 647.0,145.0 637.6,149.8" fill="#6740e0" stroke="#6740e0" stroke-width="1.5"/>
  <text x="714" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">0..*</text>
  <text x="646" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">1</text>
  <path d="M 516 216 L 867 216 L 879 228 L 879 294 L 516 294 Z" fill="#ece7fd" stroke="#6740e0" stroke-width="1.2"/>
  <path d="M 867 216 L 867 228 L 879 228" fill="none" stroke="#6740e0" stroke-width="1.2"/>
  <text x="526" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4c1d95">Un registro de horas no significa nada sin su</text>
  <text x="526" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4c1d95">proyecto. Si el proyecto desaparece, sus</text>
  <text x="526" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4c1d95">registros desaparecen con él: no hay a dónde</text>
  <text x="526" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4c1d95">reasignarlos.</text>
</svg>
